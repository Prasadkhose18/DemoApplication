name: Banking API CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: banking-api-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsBankingDeploy

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push commit-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2 through SSM and verify
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          APP_DIR="/home/ec2-user/demo-banking"
          REGION="ap-south-1"
          REGISTRY="355421126528.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE="355421126528.dkr.ecr.ap-south-1.amazonaws.com/demo-banking-api:${{ github.sha }}"
          NETWORK="demo_banking-network"

          if [ ! -f "$APP_DIR/.env" ]; then
            echo "Deployment stopped: production env file not found at $APP_DIR/.env"
            exit 1
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "Deployment stopped: AWS CLI is not installed on EC2."
            exit 1
          fi

          if ! command -v curl >/dev/null 2>&1; then
            echo "Deployment stopped: curl is not installed on EC2."
            exit 1
          fi

          OLD_IMAGE_ID=$(docker inspect --format='{{.Image}}' banking-api 2>/dev/null || true)

          aws ecr get-login-password --region "$REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          docker rm -f banking-api >/dev/null 2>&1 || true

          docker run -d \
            --name banking-api \
            --restart unless-stopped \
            --env-file "$APP_DIR/.env" \
            --network "$NETWORK" \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            -p 8080:8080 \
            "$IMAGE"

          echo "Waiting for the new API container to respond..."
          NEW_OK=false
          for attempt in $(seq 1 36); do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/swagger-ui/index.html || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              NEW_OK=true
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' banking-api 2>/dev/null | grep -q true; then
              break
            fi
            sleep 10
          done

          if [ "$NEW_OK" = "true" ]; then
            echo "Deployment successful: $IMAGE"
            exit 0
          fi

          echo "New version did not pass the HTTP check. Recent container logs:"
          docker logs --tail 100 banking-api || true

          if [ -z "$OLD_IMAGE_ID" ]; then
            echo "Rollback unavailable: no previous container image was recorded."
            exit 1
          fi

          echo "Rolling back to previous image ID: $OLD_IMAGE_ID"
          docker rm -f banking-api >/dev/null 2>&1 || true
          docker run -d \
            --name banking-api \
            --restart unless-stopped \
            --env-file "$APP_DIR/.env" \
            --network "$NETWORK" \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            -p 8080:8080 \
            "$OLD_IMAGE_ID"

          for attempt in $(seq 1 24); do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/swagger-ui/index.html || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "Rollback completed; previous API version is responding."
              exit 1
            fi
            if ! docker inspect --format='{{.State.Running}}' banking-api 2>/dev/null | grep -q true; then
              break
            fi
            sleep 10
          done

          echo "CRITICAL: the new deployment and rollback health checks both failed."
          docker logs --tail 100 banking-api || true
          exit 1
          REMOTE_SCRIPT
          )

          PARAMS=$(jq -n --arg script "$REMOTE_SCRIPT" '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DemoApplication commit $IMAGE_TAG" \
            --parameters "$PARAMS" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          STATUS="Pending"
          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          echo "Remote deployment status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment did not complete successfully."
            exit 1
          fi
